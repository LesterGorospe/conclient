<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Construction Portal (HTML/CSS/JS)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🏗️ BuildTrack Static (HTML/JS)</a>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row mb-4">
            <div class="col-md-8">
                <h2>Client & Project Tracker</h2>
                <p class="text-muted">Gumagamit ito ng LocalStorage para ma-save ang data sa iyong browser nang walang database.</p>
            </div>
            <div class="col-md-4 text-md-end">
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addProjectModal">+ Magdagdag ng Proyekto</button>
            </div>
        </div>

        <div class="row" id="projectContainer">
            </div>
    </div>

    <div class="modal fade" id="addProjectModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="projectForm">
                    <div class="modal-header">
                        <h5 class="modal-title">Bagong Proyekto</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Pangalan ng Proyekto</label>
                            <input type="text" class="form-control" id="projectName" required placeholder="Hal. Santos Commercial Building">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Pangalan ng Kliyente</label>
                            <input type="text" class="form-control" id="clientName" required placeholder="Hal. Maria Santos">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Lokasyon</label>
                            <input type="text" class="form-control" id="location" required placeholder="Hal. Lipa, Batangas">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Initial Progress (%)</label>
                            <input type="number" class="form-control" id="progress" min="0" max="100" value="0" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Isara</button>
                        <button type="submit" class="btn btn-primary">I-save ang Proyekto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Default sample data kung wala pang naka-save sa LocalStorage
        const defaultProjects = [
            {
                id: 1,
                projectName: "Bacon Residential House",
                clientName: "Juan Bacon",
                location: "San Juan, Ilocos Sur",
                progress: 45
            }
        ];

        // Kunin ang mga proyekto mula sa localStorage o gamitin ang default
        function getProjects() {
            let projects = localStorage.getItem('construction_projects');
            return projects ? JSON.parse(projects) : defaultProjects;
        }

        // I-save ang mga proyekto sa localStorage
        function saveProjects(projects) {
            localStorage.setItem('construction_projects', JSON.stringify(projects));
        }

        // I-render o ipakita ang mga proyekto sa HTML
        function renderProjects() {
            const container = document.getElementById('projectContainer');
            const projects = getProjects();
            container.innerHTML = '';

            projects.forEach((proj, index) => {
                container.innerHTML += `
                    <div class="col-md-6 mb-4">
                        <div class="card shadow-sm border-0">
                            <div class="card-body">
                                <h4 class="card-title text-primary">${proj.projectName}</h4>
                                <h6 class="card-subtitle mb-2 text-muted">Kliyente: ${proj.clientName}</h6>
                                <p class="card-text mb-1"><strong>Lokasyon:</strong> ${proj.location}</p>
                                
                                <label class="form-label fw-bold mt-2">Progreso: ${proj.progress}%</label>
                                <div class="progress mb-3" style="height: 20px;">
                                    <div class="progress-bar bg-success" role="progressbar" style="width: ${proj.progress}%;" aria-valuenow="${proj.progress}" aria-valuemin="0" aria-valuemax="100">${proj.progress}%</div>
                                </div>

                                <div class="d-flex justify-content-between align-items-center">
                                    <button class="btn btn-outline-danger btn-sm" onclick="deleteProject(${index})">Burahin</button>
                                    <div>
                                        <input type="number" id="newProg_${index}" class="form-control form-control-sm d-inline-block w-auto" value="${proj.progress}" min="0" max="100">
                                        <button class="btn btn-dark btn-sm" onclick="updateProgress(${index})">I-update Progress</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // Magdagdag ng bagong proyekto gamit ang Form
        document.getElementById('projectForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const newProj = {
                id: Date.now(),
                projectName: document.getElementById('projectName').value,
                clientName: document.getElementById('clientName').value,
                location: document.getElementById('location'].value,
                progress: parseInt(document.getElementById('progress').value)
            };

            let projects = getProjects();
            projects.push(newProj);
            saveProjects(projects);

            // I-reset ang form at i-close ang modal
            document.getElementById('projectForm').reset();
            let modalElement = document.getElementById('addProjectModal');
            let modal = bootstrap.Modal.getInstance(modalElement);
            modal.hide();

            renderProjects();
        });

        // Baguhin ang progress ng tiyak na proyekto
        function updateProgress(index) {
            let projects = getProjects();
            let newVal = document.getElementById(`newProg_${index}`).value;
            
            projects[index].progress = parseInt(newVal);
            saveProjects(projects);
            renderProjects();
        }

        // Burahin ang proyekto
        function deleteProject(index) {
            if (confirm("Sigurado ka bang gusto mong burahin ang proyektong ito?")) {
                let projects = getProjects();
                projects.splice(index, 1);
                saveProjects(projects);
                renderProjects();
            }
        }

        // Patakbuhin pag-load ng page
        renderProjects();
    </script>
</body>
</html>
